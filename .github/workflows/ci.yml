name: SAMMA V1 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: juanity
          POSTGRES_PASSWORD: juanity
          POSTGRES_DB: juanity_law
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U juanity -d juanity_law"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://juanity:juanity@localhost:5432/juanity_law
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (documented DEV exception)
        env:
          SAMMA_ENV: development
        run: npm run audit:production

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply and verify additive migrations
        working-directory: packages/database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Workflow database isolation tests
        run: npm run test:workflow

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        # Synthetic build inputs only; this workflow does not deploy its output.
        env:
          SAMMA_BASE_URL: https://samma-ci.invalid
          SAMMA_OIDC_ISSUER: https://identity-ci.invalid/realms/samma
          SAMMA_OIDC_CLIENT_ID: samma-ci-build
          SAMMA_OIDC_CLIENT_SECRET: ci-build-placeholder-not-a-credential
          AUTH_SECRET: ci-build-placeholder-not-a-runtime-secret
          SAMMA_DEV_IDENTITY_ENABLED: "false"
        run: npm run build
