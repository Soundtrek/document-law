name: juanity-dev
services:
  storage:
    image: dxflrs/garage:v2.3.0@sha256:dac0c92add4f1a0b41035e94b41036a270ffbe88a37c7ac9c3f19e6dc5bdccf2
    container_name: juanity-storage
    user: "1000:1000"
    command: ["/garage", "server"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: /etc/samma-dev/garage.toml
        target: /etc/garage.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nuc-archive/juanity/object-storage/metadata
        target: /var/lib/garage/meta
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nuc-archive/juanity/object-storage/data
        target: /var/lib/garage/data
        bind:
          create_host_path: false
    networks:
      private:
        aliases: [juanity-storage]
    mem_limit: 384m
    mem_reservation: 128m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    restart: "no"
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, /garage, status]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  private:
    name: juanity-dev
    internal: true
