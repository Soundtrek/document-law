name: juanity-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: juanity-db
    environment:
      POSTGRES_DB: juanity_law
      POSTGRES_USER: juanity
      POSTGRES_PASSWORD: ${SAMMA_DB_PASSWORD:?Set SAMMA_DB_PASSWORD in .env.nuc}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=2MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juanity -d juanity_law"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - type: bind
        source: /srv/nuc-archive/juanity/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [private]
    mem_limit: 512m
    mem_reservation: 256m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 128
    restart: "no"
    stop_grace_period: 60s
    logging: *logging

  web:
    image: ${SAMMA_NODE_IMAGE:?Set pinned SAMMA_NODE_IMAGE in .env.nuc}
    container_name: juanity-app
    user: "1000:1000"
    working_dir: /app
    init: true
    command: ["npm", "run", "start", "--workspace", "@samma/web", "--", "-H", "0.0.0.0"]
    env_file:
      - /etc/samma-dev/web.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://juanity:${SAMMA_DB_PASSWORD}@db:5432/juanity_law
      SAMMA_ENV: development
      SAMMA_BASE_URL: https://samma.co.za
      SAMMA_DEV_IDENTITY_ENABLED: "false"
      SAMMA_STORAGE_DRIVER: memory
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=640
      npm_config_cache: /npm-cache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2020:3000"
    volumes:
      - type: bind
        source: ../..
        target: /app
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nuc-archive/juanity/node_modules
        target: /app/node_modules
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nuc-archive/juanity/next-cache
        target: /app/apps/web/.next
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nuc-archive/juanity/npm-cache
        target: /npm-cache
        bind:
          create_host_path: false
    networks:
      private: {}
      proxy:
        aliases: [juanity-app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: ${SAMMA_WEB_MEMORY:-1g}
    mem_reservation: 256m
    memswap_limit: ${SAMMA_WEB_MEMORY:-1g}
    cpus: ${SAMMA_WEB_CPUS:-0.75}
    pids_limit: 256
    restart: "no"
    stop_grace_period: 30s
    logging: *logging

networks:
  private:
    name: juanity-dev
    internal: true
  proxy:
    external: true
    name: caddy-net
