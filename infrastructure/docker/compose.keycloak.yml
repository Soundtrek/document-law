name: samma-auth
services:
  auth-limit:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: samma-auth-limit
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes:
      - ../auth/auth-mail-limit.conf:/etc/nginx/nginx.conf:ro
    networks: [proxy]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.1
    pids_limit: 32
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: samma-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - type: bind
        source: /srv/nuc-archive/juanity/keycloak-postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    restart: "no"
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: samma-keycloak
    command: ["start"]
    volumes:
      - ../auth/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_HOSTNAME: https://auth.samma.co.za
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.28.0.4/32
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Required}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:2021:8080"]
    networks:
      private: {}
      proxy: { aliases: [samma-keycloak] }
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.75
    pids_limit: 256
    restart: "no"
    stop_grace_period: 30s
    logging: *logging
networks:
  private:
    name: samma-auth-private
    internal: true
  proxy:
    name: caddy-net
    external: true
