# Used only as a Caddy forward_auth gate; it never receives passwords or tokens.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Caddy overwrites this header with its actual connection address.
    limit_req_zone $http_x_samma_client zone=per_client:1m rate=30r/m;
    limit_req_zone $server_name zone=realm:1m rate=120r/m;
    server {
        listen 8080;
        server_name samma-auth-limit;
        # Only the existing Caddy proxy may supply the trusted client key.
        allow 172.28.0.4;
        deny all;
        location = /check {
            if ($http_x_samma_client = "") { return 403; }
            limit_req zone=per_client burst=10 nodelay;
            limit_req zone=realm burst=20 nodelay;
            limit_req_status 429;
            error_page 429 = @throttled;
            # A content handler is required: an early 'return 200' skips rate limits.
            root /usr/share/nginx/html;
            try_files /index.html =503;
        }
        location @throttled {
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            default_type text/plain;
            return 429 "Please wait a minute before trying again.\n";
        }
        location / { return 404; }
    }
}
